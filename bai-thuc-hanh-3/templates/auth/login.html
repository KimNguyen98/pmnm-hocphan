{% extends "base.html" %}
{% from "_macros.html" import field with context %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="auth-box">
  <h1 class="h3 mb-4">Đăng nhập</h1>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    {{ field(form.ten_dang_nhap) }}
    {{ field(form.mat_khau) }}
    <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
  </form>
  <p class="mt-3 mb-0 text-muted">Chưa có tài khoản?
    <a href="{{ url_for('auth.register', next=request.args.get('next')) }}">Đăng ký</a></p>
</div>
{% endblock %}
