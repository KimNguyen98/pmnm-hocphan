<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nhà sách Sông Hương{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Serif:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg shop-nav">
        <div class="container">
            <a class="navbar-brand brand" href="{{ url_for('shop.books') }}">Nhà sách Sông Hương</a>
            <div class="navbar-nav ms-auto flex-row gap-3">
                <a class="nav-link" href="{{ url_for('shop.books') }}">Sách</a>
                <a class="nav-link" href="{{ url_for('shop.cart') }}">
                    Giỏ hàng
                    {% if cart_count > 0 %}<span class="badge cart-badge">{{ cart_count }}</span>{% endif %}
                </a>
                <a class="nav-link nav-admin" href="{{ url_for('admin.dashboard') }}">Quản trị</a>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% for cat, msg in get_flashed_messages(with_categories=true) %}
        <div class="alert alert-{{ 'success' if cat == 'success' else 'danger' }} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
        </div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>

    <footer class="shop-footer">
        <div class="container">Nhà sách Sông Hương · Huế</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
