<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản trị · {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Serif:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% set ep = request.endpoint or '' %}
    <div class="d-flex admin-wrap">
        <nav class="admin-side p-3" aria-label="Menu quản trị">
            <div class="brand mb-3">Quản trị<br>Nhà sách Sông Hương</div>
            <a href="{{ url_for('admin.dashboard') }}" class="{{ 'active' if ep == 'admin.dashboard' }}">Tổng quan</a>
            <a href="{{ url_for('admin.books') }}" class="{{ 'active' if ep.startswith('admin.book') }}">Sách</a>
            <a href="{{ url_for('admin.categories') }}" class="{{ 'active' if ep.startswith('admin.categor') }}">Danh mục</a>
            <a href="{{ url_for('admin.orders') }}" class="{{ 'active' if ep.startswith('admin.order') }}">Đơn hàng</a>
            <hr class="border-secondary">
            <a href="{{ url_for('shop.books') }}">← Trang bán hàng</a>
        </nav>
        <main class="flex-grow-1 p-4" style="min-width:0">
            {% for cat, msg in get_flashed_messages(with_categories=true) %}
            <div class="alert alert-{{ 'success' if cat == 'success' else 'danger' }} alert-dismissible fade show" role="alert">
                {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
            </div>
            {% endfor %}
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
