<!DOCTYPE html>
<html lang="vi">

<head>
    <head>
    <meta charset="UTF-8">
    <title>{% block title %}Quản lý sách{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
</head>

<body>
    <header class="topbar">
        <div class="container">
            <h1>Quản lý sách</h1>
            <nav>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('danh_muc_list') }}">Danh mục</a>
                <a href="{{ url_for('sach_list') }}">Sách</a>
            </nav>
        </div>
    </header>
    <main class="container">
        {% for loai, noi_dung in get_flashed_messages(with_categories=true) %}
        <p class="thong-bao {{ loai }}">{{ noi_dung }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>

</html>
